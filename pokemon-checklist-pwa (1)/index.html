<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémon Full Art Checklist</title>
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6a7280;--line:#e3e6ea;--acc:#d9392b;--ok:#1f9d55;--chip:#eef0f3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#181c23;--ink:#eceff3;--mute:#98a1ae;--line:#272d37;--acc:#ff6b5b;--ok:#3ecf7b;--chip:#222833}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Noto Sans Thai","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1}
.prog{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
.bar{height:6px;background:var(--chip);border-radius:3px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
input[type=search]{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
button{font:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:9px 12px}
button.p{background:var(--acc);color:#fff}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;font-size:13px;padding:7px 2px}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{padding:8px 16px 100px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px max(6px,env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;font-size:13px;padding:11px 4px;background:transparent;font-weight:600;color:var(--mute)}
nav button.on{background:var(--ink);color:var(--bg)}
.gen{font-size:12px;color:var(--mute);padding:14px 2px 4px;letter-spacing:.04em}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0;overflow:hidden}
.item.done{opacity:.62}.item.zero{opacity:.7}.item.zero:not(.done) .chk{border-style:dashed}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:60px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:20px;color:#fff;background:transparent}
.done .chk{background:var(--ok);border-color:var(--ok)}
.cir{width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:12px;color:#fff;background:transparent}
.own .cir{background:#2f7be5;border-color:#2f7be5}
.checks{display:flex;gap:6px;flex:none}
.sp{width:40px;height:40px;flex:none;object-fit:contain}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.nm small{color:var(--mute)}
.cnt{font-size:12px;background:var(--chip);border-radius:20px;padding:3px 9px;color:var(--mute)}
.ex{background:none;padding:8px;color:var(--mute)}
.det{display:none;border-top:1px solid var(--line);padding:6px 12px 10px;font-size:13px}
.item.open .det{display:block}
.det div{padding:5px 0;border-bottom:1px dashed var(--line)}
.det div:last-child{border:0}
.r{display:inline-block;min-width:36px;text-align:center;font-weight:700;font-size:11px;border-radius:5px;padding:1px 5px;background:var(--acc);color:#fff;margin-right:6px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,520px);padding:18px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 10px;font-size:18px}
dialog p{font-size:13px;color:var(--mute);margin:6px 0}
dialog input[type=url],dialog textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
dialog textarea{height:90px;font-family:monospace}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:88vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><h1 id="ttl">Pokédex</h1><span class="prog" id="prog"></span><button id="mn" aria-label="เมนู">⚙︎</button></div>
  <div class="bar"><i id="bar"></i></div><div id="note" style="font-size:12px;color:var(--mute);margin:-2px 0 6px"></div>
  <div class="row"><input type="search" id="q" placeholder="ค้นหา ชื่อ / เลข Pokédex" autocomplete="off"></div>
  <div class="tabs" id="tabs"><button data-f="all" class="on">ทั้งหมด</button><button data-f="todo">ยังไม่มี</button><button data-f="done">ติ๊กแล้ว</button><button data-f="own">วงกลม</button><button data-f="zero">0 ใบ</button></div>
</header>
<main id="list"></main>
<nav id="nav"><button data-p="dex">Pokédex</button><button data-p="mega">Mega Dex</button><button data-p="reg">Regional</button><button data-p="gmax">Gigantamax</button></nav>
<div id="toast"></div>
<dialog id="dlg">
  <h2>ตั้งค่า</h2>
  <p>ซิงค์กับ Google Sheet (ใส่ URL ของ Apps Script Web App ที่ลงท้าย /exec) เว้นว่างไว้ = เก็บในเครื่องอย่างเดียว</p>
  <input type="url" id="sync" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="btns"><button class="p" id="save">บันทึก + ซิงค์</button><button id="pull">อัปเดตลิส/ดึงข้อมูลตอนนี้</button></div>
  <p style="margin-top:16px">สำรอง / ย้ายเครื่อง</p>
  <div class="btns"><button id="exp">คัดลอกข้อมูลที่ติ๊ก</button><button id="imp">นำเข้า</button><button id="lst">นำเข้าลิสใหม่ (JSON)</button></div>
  <textarea id="ta" placeholder="วางข้อมูลที่นี่เมื่อนำเข้า" style="display:none;margin-top:10px"></textarea>
  <div class="btns"><button id="go" style="display:none" class="p">ยืนยันนำเข้า</button><button id="cl">ปิด</button></div>
  <p id="info"></p>
</dialog>
<script>
const KEY_T='pfa.ticks.v1',KEY_L='pfa.list.v1',KEY_V='pfa.listver',KEY_S='pfa.sync',KEY_F='pfa.filter',KEY_P='pfa.page';
const $=s=>document.querySelector(s);
const sg=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const PAGES={
  dex:{title:'Pokédex',ph:'ค้นหา ชื่อ / เลข Pokédex',note:'▢ = มี Full Art แล้ว · ◯ = มีใบธรรมดา (ยังไม่ใช่ Full Art)',list:[]},
  mega:{title:'Mega Dex',ph:'ค้นหา Mega / ชื่อ / เลข',note:'▢ = มี Full Art ของ Mega ex แล้ว · ◯ = มีใบธรรมดา · ใบที่แสดงคือการ์ด Mega ex/EX ที่ตรงกับลิส',list:[]},
  reg:{title:'Regional Forms',ph:'ค้นหา ร่างภูมิภาค / ชื่อ / เลข',note:'▢ = มี Full Art แล้ว · ◯ = มีใบธรรมดา · ร่าง Alolan / Galarian / Hisuian / Paldean · Tauros Paldea รวม 3 สายพันธุ์เป็นรายการเดียว',list:[]},
  gmax:{title:'Gigantamax Dex',ph:'ค้นหา Gigantamax / ชื่อ / เลข',note:'▢ = มี Full Art VMAX แล้ว · ◯ = มีใบธรรมดา · หมายเหตุ: ใบ VMAX ที่แสดงเป็นของโปเกมอนที่มีร่าง Gigantamax แต่แหล่งข้อมูลไม่ได้ระบุว่าเป็นร่างไหน',list:[]}
};
let page=sg(KEY_P,'dex');if(!PAGES[page])page='dex';
let ticks={},filter=sg(KEY_F,'all'),q='';
try{ticks=JSON.parse(sg(KEY_T,'{}'))||{}}catch(e){ticks={}}
const isOn=k=>ticks[k]&&ticks[k][0]===1;
const isOwn=k=>ticks[k]&&ticks[k][2]===1;
const LIST=()=>PAGES[page].list;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function genOf(d){return d<=151?'Gen 1 · Kanto':d<=251?'Gen 2 · Johto':d<=386?'Gen 3 · Hoenn':d<=493?'Gen 4 · Sinnoh':d<=649?'Gen 5 · Unova':d<=721?'Gen 6 · Kalos':d<=809?'Gen 7 · Alola':d<=905?'Gen 8 · Galar/Hisui':'Gen 9 · Paldea'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function detail(p){return p.l.map((x,i)=>{const m=x.split(' / ');const r=m.shift();return `<div><span class="r">${esc(r)}</span>${esc(m.join(' / '))}${p.y&&p.y[i]?` <small style="color:var(--mute)">(${esc(p.y[i])})</small>`:''}</div>`}).join('')}
function prep(arr){arr.forEach(p=>{if(p.k==null)p.k=String(p.d);if(p.b==null)p.b=p.d;if(p.s==null)p.s=p.d;p.l=p.l||[];p.y=p.y||[]});return arr}
function render(){
  const L=LIST(),ql=q.trim().toLowerCase();let html='',lastG='';
  for(const p of L){const on=isOn(p.k),ow=isOwn(p.k);
    if(filter==='todo'&&(on||p.c===0))continue;if(filter==='zero'&&p.c>0)continue;if(filter==='done'&&!on)continue;if(filter==='own'&&!ow)continue;
    if(ql&&!(String(p.b).includes(ql.replace(/^#/,''))||p.e.toLowerCase().includes(ql)||p.j.includes(q.trim())))continue;
    const g=genOf(p.b);if(g!==lastG){html+=`<div class="gen">${g}</div>`;lastG=g}
    html+=`<div class="item${on?' done':''}${ow?' own':''}${p.c===0?' zero':''}" data-k="${p.k}"><div class="top"><div class="checks"><div class="chk" data-a="t">${on?'✓':''}</div><div class="cir" data-a="c">${ow?'●':''}</div></div>
    <img class="sp" loading="lazy" alt="" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.s}.png" onerror="this.style.visibility='hidden'">
    <div class="nm" data-a="t"><b>#${String(p.b).padStart(4,'0')} ${esc(p.e)}</b><small>${esc(p.j)}</small></div>
    <span class="cnt">${p.c} ใบ</span>${p.c>0?'<button class="ex" data-a="o" aria-label="ดูรายการ">▾</button>':''}</div>${p.c>0?`<div class="det">${detail(p)}</div>`:''}</div>`;
  }
  $('#list').innerHTML=html||'<div class="empty">ไม่พบรายการ</div>';updProg();
}
function updProg(){const L=LIST();let c=0,T=0,x=0,o=0;for(const p of L){if(p.c>0)T++;if(isOn(p.k)){if(p.c>0)c++;else x++}if(isOwn(p.k))o++}
  $('#prog').textContent=`${c} / ${T}`+(x?` +${x}`:'')+(o?` · ●${o}`:'');$('#bar').style.width=(T?c/T*100:0)+'%'}
function setPage(pg){page=pg;ss(KEY_P,pg);q='';$('#q').value='';$('#q').placeholder=PAGES[pg].ph;$('#note').textContent=PAGES[pg].note;$('#ttl').textContent=PAGES[pg].title;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===pg));window.scrollTo(0,0);render()}
let pushT;
function persist(){ss(KEY_T,JSON.stringify(ticks));clearTimeout(pushT);pushT=setTimeout(push,800)}
$('#list').addEventListener('click',e=>{
  const it=e.target.closest('.item');if(!it)return;const a=e.target.closest('[data-a]');if(!a)return;
  const k=it.dataset.k;
  if(a.dataset.a==='t'||a.dataset.a==='c'){
    const cur=ticks[k]||[0,0,0];
    ticks[k]=a.dataset.a==='t'?[cur[0]===1?0:1,Date.now(),cur[2]===1?1:0]:[cur[0]===1?1:0,Date.now(),cur[2]===1?0:1];
    persist();
    if(filter==='all'){it.classList.toggle('done',isOn(k));it.classList.toggle('own',isOwn(k));
      it.querySelector('.chk').textContent=isOn(k)?'✓':'';it.querySelector('.cir').textContent=isOwn(k)?'●':'';updProg()}
    else render();}
  else it.classList.toggle('open');
});
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;ss(KEY_F,filter);
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setPage(b.dataset.p)});
/* ---- sync ---- */
function mergeTicks(remote){let ch=false;for(const d in remote){const r=remote[d];if(!ticks[d]||r[1]>ticks[d][1]){ticks[d]=r;ch=true}}return ch}
async function pull(silent){
  const url=sg(KEY_S,'');if(!url){if(!silent)toast('ยังไม่ได้ตั้งค่า URL ซิงค์');return}
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=pull&t='+Date.now());const j=await r.json();
    let msg='ซิงค์แล้ว';
    if(j.ticks&&mergeTicks(j.ticks)){ss(KEY_T,JSON.stringify(ticks))}
    if(j.list&&j.list.length&&j.version!==sg(KEY_V,'')){const old=PAGES.dex.list.length;PAGES.dex.list=prep(j.list);ss(KEY_L,JSON.stringify(j.list));ss(KEY_V,j.version);msg=`อัปเดตลิส Pokédex แล้ว (${old} → ${j.list.length} ตัว)`}
    render();await push(true);if(!silent)toast(msg);
  }catch(e){if(!silent)toast('ซิงค์ไม่สำเร็จ (ใช้ข้อมูลในเครื่องต่อ)')}
}
async function push(silent){
  const url=sg(KEY_S,'');if(!url)return;
  try{await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'push',ticks})})}catch(e){}
}
/* ---- settings ---- */
const dlg=$('#dlg');
$('#mn').onclick=()=>{$('#sync').value=sg(KEY_S,'');const T=Object.values(ticks);$('#info').textContent=`Pokédex ${PAGES.dex.list.length} ตัว (มี Full Art ${PAGES.dex.list.filter(p=>p.c>0).length}) · Mega ${PAGES.mega.list.length} · Regional ${PAGES.reg.list.length} · Gigantamax ${PAGES.gmax.list.length} · ติ๊ก Full Art ${T.filter(v=>v[0]===1).length} · วงกลม ${T.filter(v=>v[2]===1).length}`;dlg.showModal()};
$('#cl').onclick=()=>{dlg.close();$('#ta').style.display='none';$('#go').style.display='none'};
$('#save').onclick=()=>{ss(KEY_S,$('#sync').value.trim());dlg.close();pull()};
$('#pull').onclick=()=>{ss(KEY_S,$('#sync').value.trim());dlg.close();pull()};
let mode='';
$('#exp').onclick=async()=>{const t=JSON.stringify(ticks);try{await navigator.clipboard.writeText(t);toast('คัดลอกแล้ว')}catch(e){$('#ta').style.display='block';$('#ta').value=t}};
$('#imp').onclick=()=>{mode='t';$('#ta').style.display='block';$('#ta').value='';$('#go').style.display='inline-block'};
$('#lst').onclick=()=>{mode='l';$('#ta').style.display='block';$('#ta').value='';$('#go').style.display='inline-block'};
$('#go').onclick=()=>{try{const j=JSON.parse($('#ta').value);
  if(mode==='t'){mergeTicks(j);ss(KEY_T,JSON.stringify(ticks));toast('นำเข้าข้อมูลแล้ว')}
  else{if(!Array.isArray(j)||!j[0].d)throw 0;PAGES.dex.list=prep(j);ss(KEY_L,JSON.stringify(j));ss(KEY_V,'manual');toast('นำเข้าลิส Pokédex แล้ว '+j.length+' ตัว')}
  dlg.close();render();push()}catch(e){toast('รูปแบบข้อมูลไม่ถูกต้อง')}};
/* ---- boot ---- */
async function getJ(name,inl){if(window[inl])return window[inl];try{return await (await fetch(name,{cache:'no-cache'})).json()}catch(e){return[]}}
async function boot(){
  let saved=null;try{saved=JSON.parse(sg(KEY_L,'null'))}catch(e){}
  const base=await getJ('list.json','__LIST__');
  PAGES.dex.list=prep((saved&&saved.length&&sg(KEY_V,'')!=='')?saved:base);
  PAGES.mega.list=prep(await getJ('mega.json','__MEGA__'));
  PAGES.gmax.list=prep(await getJ('gmax.json','__GMAX__'));
  PAGES.reg.list=prep(await getJ('regional.json','__REG__'));
  setPage(page);pull(true);
  if('storage' in navigator&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(true)});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.__LIST__)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
